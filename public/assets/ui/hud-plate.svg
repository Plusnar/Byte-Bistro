<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" viewBox="0 0 480 96" preserveAspectRatio="none" role="img" aria-label="HUD header plate">
  <defs>
    <linearGradient id="hpBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20313a"/>
      <stop offset="0.08" stop-color="#17262e"/>
      <stop offset="0.5" stop-color="#101c22"/>
      <stop offset="0.92" stop-color="#0b151a"/>
      <stop offset="1" stop-color="#080f13"/>
    </linearGradient>
    <linearGradient id="hpSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hpTrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.15"/>
      <stop offset="0.18" stop-color="#ffb020" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="0.82" stop-color="#ffb020" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="hpHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="none"/>
      <path d="M0 0V6" stroke="#8fd4de" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="hpDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#7fe3d0" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="480" height="96" fill="url(#hpBody)"/>
  <rect width="480" height="96" fill="url(#hpHatch)"/>
  <rect width="480" height="96" fill="url(#hpDots)"/>
  <rect width="480" height="96" fill="url(#hpSheen)"/>

  <!-- top light bar and bottom shadow -->
  <rect x="0" y="0" width="480" height="1.6" fill="#cfeff5" fill-opacity="0.28"/>
  <rect x="0" y="1.6" width="480" height="1" fill="#000000" fill-opacity="0.35"/>
  <rect x="0" y="94" width="480" height="2" fill="#000000" fill-opacity="0.5"/>

  <!-- amber trim rail -->
  <rect x="0" y="88" width="480" height="2.2" fill="url(#hpTrim)"/>
  <rect x="0" y="90.2" width="480" height="1" fill="#000000" fill-opacity="0.45"/>

  <!-- panel seam + rivets -->
  <g stroke="#0a1216" stroke-opacity="0.8" stroke-width="1">
    <path d="M0 12H480"/>
  </g>
  <g fill="#2b4148">
    <circle cx="12" cy="48" r="2.6"/>
    <circle cx="468" cy="48" r="2.6"/>
    <circle cx="34" cy="48" r="1.9"/>
    <circle cx="446" cy="48" r="1.9"/>
  </g>
  <g fill="#8fd4de" fill-opacity="0.35">
    <circle cx="11.2" cy="47.2" r="0.9"/>
    <circle cx="467.2" cy="47.2" r="0.9"/>
  </g>

  <!-- hazard stripes on the left edge -->
  <g opacity="0.5">
    <rect x="0" y="82" width="54" height="6" fill="#0d171c"/>
    <path d="M0 88 L10 82 H18 L8 88 Z M12 88 L22 82 H30 L20 88 Z M24 88 L34 82 H42 L32 88 Z M36 88 L46 82 H54 L44 88 Z" fill="#ffb020" fill-opacity="0.55"/>
  </g>
</svg>