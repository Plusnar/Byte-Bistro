<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b27" />
    <meta name="description" content="Byte Bistro — o terminal culinário que alimenta a IA CORE." />
    <link rel="icon" type="image/svg+xml" href="/assets/ui/byte-bistro-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts load without blocking the first paint: a plain stylesheet link here would hold
      the loading screen back until Google answered. The faces use display=swap, so text
      shows in the fallback font first and swaps in when they arrive.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>
    <title>Byte Bistro</title>
    <!--
      The loading screen's styles are inline so it paints on the very first frame, before
      the game's JavaScript (the largest download) has even started. Every animation here
      moves only `transform` and `opacity`, which the browser runs on the compositor thread:
      they keep playing smoothly while the main thread is busy parsing models.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #050b27; }
      .boot-loader {
        --ink: #102445; --cyan: #1bdcff; --green: #66f4cf; --red: #ff688d;
        --text: #edfaff;
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center;
        overflow: hidden;
        background: #03142d url("/assets/ui/loading-circuit.webp") no-repeat center / 100% 100%;
        font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        transition: opacity 0.45s ease, visibility 0s linear 0.45s;
      }
      .boot-loader[data-state="done"] { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-loader[hidden] { display: none; }
      .bl-card {
        position: relative;
        width: min(1000px, calc(100vw - 8px));
        text-align: center;
      }
      .bl-logo {
        display: block;
        width: min(48vw, 300px);
        height: clamp(54px, 18vh, 150px);
        margin: 0 auto 6px;
        object-fit: contain;
      }

      .bl-stage {
        display: flex; justify-content: center; margin: 8px auto 12px;
        width: min(100%, 105vh);
      }
      .bl-cook {
        position: relative; flex: 1 1 0; min-width: 0;
        aspect-ratio: 140 / 200; overflow: hidden;
      }
      /* Four poses per row, aligned to the same character scale and anchor. */
      .bl-cook::before {
        content: ""; position: absolute; top: var(--row, 0%); left: 0;
        width: 400%; height: 400%;
        background: url("/assets/ui/loading-cooks.webp") no-repeat 0 0 / 100% 100%;
        animation: bl-run 0.72s steps(4, end) infinite;
        animation-delay: var(--phase, 0s);
      }
      .bl-cook:nth-child(2) { --row: -100%; --phase: -0.18s; }
      .bl-cook:nth-child(3) { --row: -200%; --phase: -0.54s; }
      .bl-cook:nth-child(4) { --row: -300%; --phase: -0.36s; }

      .bl-bar, .bl-row { width: min(760px, calc(100vw - 16px)); margin-inline: auto; }
      .bl-bar {
        display: grid; grid-template-columns: minmax(0, 1fr) 5ch; align-items: center;
        min-height: 28px; padding: 3px; box-sizing: border-box;
        border: 2px solid #d9f8ff; border-radius: 999px; background: #0a4fb3;
        box-shadow: inset 0 2px 5px #03142d;
      }
      .bl-track { position: relative; align-self: stretch; border-radius: 999px; overflow: hidden; background: #081938; }
      .bl-fill {
        position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0);
        border-radius: inherit; background: linear-gradient(#ffdf54, #ffb400 55%, #e96600); will-change: transform;
      }
      /* A moving sheen, so the bar reads as alive even between progress updates. */
      .bl-fill::after {
        content: ""; position: absolute; inset: 0; width: 40%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
        animation: bl-sheen 1.3s linear infinite; will-change: transform;
      }
      .bl-row {
        display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
        margin-top: 10px; font-size: 14px; font-weight: 600;
      }
      .bl-status { text-align: left; overflow-wrap: anywhere; }
      .bl-pct { font-variant-numeric: tabular-nums; font-weight: 800; text-align: center; }
      .bl-actions { display: none; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
      .boot-loader[data-state="error"] .bl-actions { display: flex; }
      .boot-loader[data-state="error"] .bl-fill { background: var(--red); }
      .boot-loader:is([data-state="error"], [data-state="done"]) .bl-cook::before,
      .boot-loader:is([data-state="error"], [data-state="done"]) .bl-fill::after { animation-play-state: paused; }
      .bl-actions button {
        padding: 9px 16px; border: 3px solid var(--ink); border-radius: 12px;
        box-shadow: 0 3px 0 var(--ink); font: inherit; font-weight: 700; cursor: pointer;
        background: #264366; color: var(--text);
      }
      .bl-actions button[data-primary] { background: var(--green); color: var(--ink); }
      .bl-actions button[hidden] { display: none; }

      @keyframes bl-run { to { transform: translateX(-100%); } }
      @keyframes bl-sheen { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

      @media (prefers-reduced-motion: reduce) {
        .bl-cook::before, .bl-fill::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Byte Bistro 3D"></canvas>
      <div id="ui-root"></div>
      <div id="boot-loader" class="boot-loader" data-ui="boot-loader" data-state="loading" data-mode="boot"
        role="progressbar" aria-label="Carregando Byte Bistro" data-i18n-attr="aria-label:boot.aria" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bl-card">
          <img class="bl-logo" src="/assets/ui/play-menu-logo.webp" alt="Byte Bistro" fetchpriority="high">
          <div class="bl-stage" aria-hidden="true">
            <div class="bl-cook"></div>
            <div class="bl-cook"></div>
            <div class="bl-cook"></div>
            <div class="bl-cook"></div>
          </div>
          <div class="bl-bar">
            <div class="bl-track"><div class="bl-fill"></div></div>
            <span class="bl-pct">0%</span>
          </div>
          <div class="bl-row">
            <span class="bl-status" aria-live="polite">Carregando o jogo...</span>
          </div>
          <div class="bl-actions">
            <button type="button" data-action="boot-retry" data-primary data-i18n="boot.retry">Tentar novamente</button>
            <button type="button" data-action="boot-continue" data-i18n="boot.continue">Continuar mesmo assim</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      performance.mark("bb:loading-shown");
      // The loader shows before the game's code arrives, so it picks its language itself: the
      // save's choice, else the browser's, as src/i18n does. Keep the texts in step with
      // boot.* in src/i18n/en.ts.
      var bbEnglish = (function () {
        try {
          var save = JSON.parse(localStorage.getItem("byte-bistro:save") || "{}");
          var chosen = save && save.settings && save.settings.language;
          if (chosen === "pt" || chosen === "en") return chosen === "en";
        } catch (error) { /* no storage: fall back to the browser */ }
        return !String(navigator.language || "").toLowerCase().startsWith("pt");
      })();
      if (bbEnglish) {
        document.documentElement.lang = "en-US";
        var bbLoader = document.getElementById("boot-loader");
        bbLoader.setAttribute("aria-label", "Loading Byte Bistro");
        bbLoader.querySelector(".bl-status").textContent = "Loading the game...";
        bbLoader.querySelector("[data-action='boot-retry']").textContent = "Try again";
        bbLoader.querySelector("[data-action='boot-continue']").textContent = "Continue anyway";
      }
      // Watchdog for the one failure the game's own code cannot report: its JavaScript never
      // arriving. main.ts sets __bbBooted as its first act; if that has not happened after
      // 25 s, the loader offers a reload instead of animating forever.
      setTimeout(function () {
        if (window.__bbBooted) return;
        var loader = document.getElementById("boot-loader");
        if (!loader) return;
        loader.dataset.state = "error";
        loader.querySelector(".bl-status").textContent = bbEnglish ? "The game could not be loaded." : "Não foi possível carregar o jogo.";
        var retry = loader.querySelector("[data-action='boot-retry']");
        retry.textContent = bbEnglish ? "Reload" : "Recarregar";
        retry.onclick = function () { location.reload(); };
        loader.querySelector("[data-action='boot-continue']").hidden = true;
      }, 25000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
